<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affinova Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ══ DESIGN TOKENS ══════════════════════════════════════════════ */
    :root {
      --bg:         #07090e;
      --surface:    #0e1420;
      --card:       #131c2b;
      --border:     rgba(255,255,255,0.07);
      --accent:     #2ee6a6;
      --accent-dim: rgba(46,230,166,.18);
      --danger:     #ff4d6d;
      --warn:       #ffb020;
      --violet:     #7c8cff;
      --text:       #e8ecf4;
      --muted:      #6b7a9a;
      --sidebar-w:  260px;
      --radius:     14px;
      --trans:      all .3s ease;
    }
    [data-theme="light"] {
      --bg:      #f0f4fb;
      --surface: #ffffff;
      --card:    #f8faff;
      --border:  rgba(0,0,0,0.08);
      --text:    #111827;
      --muted:   #6b7280;
      --accent-dim: rgba(13,148,136,.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      transition: var(--trans);
    }

    /* ══ LOGIN OVERLAY ══════════════════════════════════════════════ */
    #login-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 80px rgba(0,0,0,.4);
      animation: slideUp .5s ease;
    }
    .login-card h1 {
      font-family: 'Sora', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 6px;
    }
    .login-card p { color: var(--muted); margin-bottom: 32px; font-size: .9rem; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .field input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-size: .95rem;
      font-family: inherit;
      outline: none;
      transition: var(--trans);
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .btn-primary {
      width: 100%; padding: 13px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #20c997);
      color: #0a1f1a; font-weight: 700; font-size: .95rem;
      border: none; cursor: pointer; transition: var(--trans);
      font-family: 'Sora', sans-serif;
    }
    .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
    #login-error { color: var(--danger); font-size: .85rem; margin-top: 12px; display: none; }

    /* ══ SIDEBAR ════════════════════════════════════════════════════ */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      height: 100vh; position: fixed; top: 0; left: 0;
      z-index: 100; transition: var(--trans);
      overflow: hidden;
    }
    .sidebar-logo {
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo span {
      font-family: 'Sora', sans-serif;
      font-size: 1.3rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--violet));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sidebar-logo small {
      display: block; font-size: .7rem; color: var(--muted);
      margin-top: 2px; -webkit-text-fill-color: var(--muted);
    }
    nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
    .nav-section { font-size: .7rem; color: var(--muted); font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase; padding: 12px 12px 6px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 10px; cursor: pointer;
      font-size: .9rem; color: var(--muted);
      transition: var(--trans); margin-bottom: 2px;
      border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item svg { flex-shrink: 0; }
    .nav-item:hover { background: var(--accent-dim); color: var(--accent); }
    .nav-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
    .nav-badge {
      margin-left: auto; background: var(--danger);
      color: #fff; font-size: .65rem; font-weight: 700;
      border-radius: 20px; padding: 1px 7px; min-width: 20px; text-align: center;
    }

    /* ══ MAIN CONTENT ═══════════════════════════════════════════════ */
    .main-wrap { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

    /* Topbar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 90;
    }
    .topbar h2 { font-family: 'Sora', sans-serif; font-size: 1.3rem; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .theme-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--card); border: 1px solid var(--border);
      cursor: pointer; display: grid; place-items: center;
      color: var(--text); transition: var(--trans);
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
    .admin-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--violet));
      display: grid; place-items: center;
      font-weight: 700; font-size: .85rem; color: #0a1f1a;
    }
    .logout-btn {
      padding: 7px 16px; border-radius: 8px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--danger); cursor: pointer; font-size: .85rem;
      transition: var(--trans); font-family: inherit;
    }
    .logout-btn:hover { background: rgba(255,77,109,.12); border-color: var(--danger); }

    /* Pages */
    .page { padding: 32px; display: none; animation: fadeIn .3s ease; }
    .page.active { display: block; }

    /* Stat cards */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px;
      transition: var(--trans);
    }
    .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .stat-label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
    .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; }
    .stat-card.teal .stat-value { color: var(--accent); }
    .stat-card.violet .stat-value { color: var(--violet); }
    .stat-card.danger .stat-value { color: var(--danger); }
    .stat-card.warn .stat-value { color: var(--warn); }

    /* Section header */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .section-header h3 { font-family: 'Sora', sans-serif; font-size: 1.1rem; }

    /* Table */
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--surface); }
    th { padding: 12px 16px; text-align: left; font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    td { padding: 12px 16px; font-size: .875rem; border-top: 1px solid var(--border); }
    tr:hover td { background: rgba(255,255,255,.02); }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: .8rem; }

    /* Badges */
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: .72rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    }
    .badge-green { background: rgba(46,230,166,.15); color: var(--accent); }
    .badge-yellow { background: rgba(255,176,32,.15); color: var(--warn); }
    .badge-red { background: rgba(255,77,109,.15); color: var(--danger); }
    .badge-blue { background: rgba(124,140,255,.15); color: var(--violet); }
    .badge-gray { background: rgba(107,122,154,.15); color: var(--muted); }

    /* Action buttons */
    .action-btn {
      padding: 5px 12px; border-radius: 7px; font-size: .78rem;
      cursor: pointer; border: 1px solid; transition: var(--trans);
      font-family: inherit; font-weight: 500; background: transparent;
    }
    .action-btn-green { border-color: var(--accent); color: var(--accent); }
    .action-btn-green:hover { background: var(--accent-dim); }
    .action-btn-danger { border-color: var(--danger); color: var(--danger); }
    .action-btn-danger:hover { background: rgba(255,77,109,.12); }
    .action-btn-violet { border-color: var(--violet); color: var(--violet); }
    .action-btn-violet:hover { background: rgba(124,140,255,.12); }

    /* Search + filters */
    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-box {
      flex: 1; min-width: 200px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px;
      color: var(--text); font-family: inherit; font-size: .9rem; outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    select.filter {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px;
      color: var(--text); font-family: inherit; font-size: .9rem; outline: none;
    }

    /* Notification modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.7);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 32px; width: 100%; max-width: 500px;
      animation: slideUp .3s ease;
    }
    .modal h3 { font-family: 'Sora', sans-serif; margin-bottom: 20px; }
    .modal textarea {
      width: 100%; min-height: 100px; resize: vertical;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; color: var(--text);
      font-family: inherit; font-size: .9rem; outline: none; margin-top: 4px;
    }
    .modal-actions { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }
    .btn-cancel {
      padding: 10px 22px; border-radius: 10px; cursor: pointer;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      font-family: inherit; font-size: .9rem; transition: var(--trans);
    }

    /* Empty state */
    .empty { text-align: center; padding: 60px; color: var(--muted); }
    .empty svg { opacity: .3; margin-bottom: 16px; }

    /* Loader */
    .loader { display: flex; justify-content: center; padding: 40px; }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }

    /* Alert toast */
    #toast {
      position: fixed; bottom: 32px; right: 32px; z-index: 9999;
      background: var(--card); border: 1px solid var(--accent);
      color: var(--text); border-radius: 12px; padding: 14px 22px;
      font-size: .9rem; font-weight: 500;
      transform: translateY(60px); opacity: 0; transition: all .35s ease;
      pointer-events: none; max-width: 340px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.error { border-color: var(--danger); }

    /* Keyframes */
    @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spin    { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-wrap { margin-left: 0; }
      .page { padding: 20px; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<!-- ══ LOGIN OVERLAY ══════════════════════════════════════════════ -->
<div id="login-overlay">
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 16px;">
      <img src="logo.png" alt="Affinova" style="width: 54px; height: 54px; object-fit: contain;">
    </div>
    <h1>Admin Panel</h1>
    <p>Sign in with your admin credentials to manage Affinova.</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="admin-email" placeholder="admin@affinova.io" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="admin-pass" placeholder="••••••••" />
    </div>
    <button class="btn-primary" onclick="adminLogin()">Sign In to Admin</button>
    <p id="login-error"></p>
  </div>
</div>

<!-- ══ SIDEBAR ════════════════════════════════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo" style="display: flex; align-items: center; gap: 12px;">
    <img src="logo.png" alt="Affinova" style="width: 36px; height: 36px; object-fit: contain; flex-shrink: 0;">
    <div>
      <span>Affinova</span>
      <small>Admin Control Centre</small>
    </div>
  </div>
  <nav>
    <div class="nav-section">Overview</div>
    <button class="nav-item active" onclick="showPage('dashboard')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </button>

    <div class="nav-section">Management</div>
    <button class="nav-item" onclick="showPage('users')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Users
    </button>
    <button class="nav-item" onclick="showPage('links')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      Affiliate Links
    </button>
    <button class="nav-item" onclick="showPage('payouts')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      Payouts
      <span class="nav-badge" id="pending-badge" style="display:none">0</span>
    </button>
    <button class="nav-item" onclick="showPage('messages')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Messages
      <span class="nav-badge" id="msg-badge" style="display:none">0</span>
    </button>
    <button class="nav-item" onclick="showPage('notifications')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Notifications
    </button>
  </nav>
</aside>

<!-- ══ MAIN ═══════════════════════════════════════════════════════ -->
<div class="main-wrap">
  <!-- Topbar -->
  <header class="topbar">
    <h2 id="page-title">Dashboard</h2>
    <div class="topbar-right">
      <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">
        <svg id="theme-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <div class="admin-avatar" id="topbar-initials">A</div>
      <button class="logout-btn" onclick="adminLogout()">Logout</button>
    </div>
  </header>

  <!-- ── Dashboard ── -->
  <section class="page active" id="page-dashboard">
    <div class="stat-grid" id="stat-grid">
      <div class="loader"><div class="spinner"></div></div>
    </div>
    <div class="section-header">
      <h3>Quick Actions</h3>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <button class="action-btn action-btn-green" onclick="showPage('users')">Manage Users</button>
      <button class="action-btn action-btn-violet" onclick="showPage('payouts')">Review Payouts</button>
      <button class="action-btn action-btn-green" onclick="openNotifModal()">Send Notification</button>
      <button class="action-btn action-btn-violet" onclick="showPage('messages')">View Messages</button>
    </div>
  </section>

  <!-- ── Users ── -->
  <section class="page" id="page-users">
    <div class="toolbar">
      <input class="search-box" id="user-search" placeholder="Search by name or email…" oninput="filterUsers()" />
      <select class="filter" id="user-plan-filter" onchange="filterUsers()">
        <option value="">All Plans</option>
        <option value="starter">Starter</option>
        <option value="pro">Pro</option>
        <option value="elite">Elite</option>
      </select>
    </div>
    <div class="table-wrap" id="users-table-wrap">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </section>

  <!-- ── Affiliate Links ── -->
  <section class="page" id="page-links">
    <div class="toolbar">
      <input class="search-box" id="link-search" placeholder="Search links…" oninput="filterLinks()" />
    </div>
    <div class="table-wrap" id="links-table-wrap">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </section>

  <!-- ── Payouts ── -->
  <section class="page" id="page-payouts">
    <div class="toolbar">
      <select class="filter" id="payout-status-filter" onchange="filterPayouts()">
        <option value="">All Status</option>
        <option value="Pending">Pending</option>
        <option value="Processing">Processing</option>
        <option value="Paid">Paid</option>
      </select>
    </div>
    <div class="table-wrap" id="payouts-table-wrap">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </section>

  <!-- ── Messages ── -->
  <section class="page" id="page-messages">
    <div class="table-wrap" id="messages-table-wrap">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </section>

  <!-- ── Notifications ── -->
  <section class="page" id="page-notifications">
    <div class="section-header">
      <h3>Sent Notifications</h3>
      <button class="action-btn action-btn-green" onclick="openNotifModal()">+ Send New</button>
    </div>
    <div class="table-wrap" id="notifications-table-wrap">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </section>
</div>

<!-- ══ NOTIFICATION MODAL ════════════════════════════════════════ -->
<div class="modal-overlay" id="notif-modal">
  <div class="modal">
    <h3>Send Notification</h3>
    <div class="field">
      <label>Title</label>
      <input type="text" id="notif-title" placeholder="Notification title" class="field input" style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:.95rem;font-family:inherit;outline:none;margin-top:4px;" />
    </div>
    <div class="field" style="margin-top:14px;">
      <label>Message</label>
      <textarea id="notif-body" placeholder="Notification body…"></textarea>
    </div>
    <div class="field" style="margin-top:14px;">
      <label>Type</label>
      <select id="notif-type" style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:.9rem;outline:none;margin-top:4px;">
        <option value="info">Info</option>
        <option value="success">Success</option>
        <option value="warning">Warning</option>
        <option value="payment">Payment</option>
      </select>
    </div>
    <div class="field" style="margin-top:14px;">
      <label>Target</label>
      <select id="notif-target" style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:.9rem;outline:none;margin-top:4px;">
        <option value="">Broadcast to ALL users</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeNotifModal()">Cancel</button>
      <button class="btn-primary" style="width:auto;padding:10px 28px;" onclick="sendNotification()">Send</button>
    </div>
  </div>
</div>

<!-- ══ TOAST ═════════════════════════════════════════════════════ -->
<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────
let TOKEN = localStorage.getItem('affinova_admin_token') || '';
const API = '';   // same origin

let _users = [], _links = [], _payouts = [], _messages = [];

// ── Utils ──────────────────────────────────────────────────────────
async function apiFetch(path, opts={}) {
  const res = await fetch(API + path, {
    headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json', ...(opts.headers||{}) },
    ...opts
  });
  if (!res.ok) {
    const err = await res.json().catch(()=>({detail:'Request failed'}));
    throw new Error(err.detail || 'Unknown error');
  }
  return res.json();
}

function toast(msg, isError=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isError ? 'error show' : 'show';
  setTimeout(() => el.className = '', 3000);
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

// ── Auth ───────────────────────────────────────────────────────────
async function adminLogin() {
  const email = document.getElementById('admin-email').value.trim();
  const pass  = document.getElementById('admin-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.detail || 'Invalid email or password.');
    }
    const data = await res.json();
    TOKEN = data.access_token;

    // Verify admin status
    const me = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${TOKEN}` } });
    const user = await me.json();
    if (!user.is_admin) throw new Error('This account does not have admin privileges.');

    localStorage.setItem('affinova_admin_token', TOKEN);
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('topbar-initials').textContent = user.full_name.charAt(0).toUpperCase();
    initAdminPanel();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

function adminLogout() {
  localStorage.removeItem('affinova_admin_token');
  TOKEN = '';
  location.reload();
}

// ── Navigation ─────────────────────────────────────────────────────
const PAGE_TITLES = {
  dashboard: 'Dashboard',
  users: 'User Management',
  links: 'Affiliate Links',
  payouts: 'Payouts',
  messages: 'Contact Messages',
  notifications: 'Notifications'
};

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelector(`[onclick="showPage('${name}')"]`).classList.add('active');
  document.getElementById('page-title').textContent = PAGE_TITLES[name];

  if (name === 'users') loadUsers();
  if (name === 'links') loadLinks();
  if (name === 'payouts') loadPayouts();
  if (name === 'messages') loadMessages();
  if (name === 'notifications') loadNotifications();
}

// ── Init ───────────────────────────────────────────────────────────
async function initAdminPanel() {
  await loadSummary();
  await loadUsers();  // preload for notification modal
}

// ── Dashboard Summary ──────────────────────────────────────────────
async function loadSummary() {
  try {
    const s = await apiFetch('/api/admin/summary');
    document.getElementById('stat-grid').innerHTML = `
      <div class="stat-card teal">
        <div class="stat-label">Total Users</div>
        <div class="stat-value">${s.total_users}</div>
        <div style="font-size:.8rem;color:var(--muted);margin-top:6px;">${s.verified_users} verified</div>
      </div>
      <div class="stat-card violet">
        <div class="stat-label">Total Links</div>
        <div class="stat-value">${s.total_links}</div>
      </div>
      <div class="stat-card teal">
        <div class="stat-label">Total Clicks</div>
        <div class="stat-value">${s.total_clicks.toLocaleString()}</div>
      </div>
      <div class="stat-card warn">
        <div class="stat-label">Pending Payouts</div>
        <div class="stat-value">${s.pending_payouts}</div>
      </div>
      <div class="stat-card teal">
        <div class="stat-label">Total Paid Out</div>
        <div class="stat-value">\u20B9${s.total_paid_out.toLocaleString()}</div>
      </div>
      <div class="stat-card danger">
        <div class="stat-label">Unread Messages</div>
        <div class="stat-value">${s.unread_messages}</div>
      </div>
    `;
    // Update nav badges
    if (s.pending_payouts > 0) {
      document.getElementById('pending-badge').textContent = s.pending_payouts;
      document.getElementById('pending-badge').style.display = '';
    }
    if (s.unread_messages > 0) {
      document.getElementById('msg-badge').textContent = s.unread_messages;
      document.getElementById('msg-badge').style.display = '';
    }
  } catch(e) {
    toast('Failed to load summary: ' + e.message, true);
  }
}

// ── Users ──────────────────────────────────────────────────────────
async function loadUsers() {
  const wrap = document.getElementById('users-table-wrap');
  if (!wrap) return;
  try {
    _users = await apiFetch('/api/admin/users');
    renderUsers(_users);
    // Populate notification user selector
    const sel = document.getElementById('notif-target');
    sel.innerHTML = '<option value="">Broadcast to ALL users</option>';
    _users.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = `${u.full_name} (${u.email})`;
      sel.appendChild(opt);
    });
  } catch(e) {
    wrap.innerHTML = `<div class="empty">Failed to load users: ${e.message}</div>`;
  }
}

function renderUsers(list) {
  const wrap = document.getElementById('users-table-wrap');
  if (!list.length) { wrap.innerHTML = '<div class="empty">No users found.</div>'; return; }
  wrap.innerHTML = `<table>
    <thead><tr>
      <th>Name</th><th>Email</th><th>Plan</th><th>Status</th>
      <th>Balance</th><th>Joined</th><th>Actions</th>
    </tr></thead>
    <tbody>
    ${list.map(u => `
      <tr>
        <td>${u.full_name}</td>
        <td class="mono">${u.email}</td>
        <td><span class="badge ${u.plan==='elite'?'badge-violet':u.plan==='pro'?'badge-blue':'badge-gray'}">${u.plan}</span></td>
        <td>
          ${u.is_admin ? '<span class="badge badge-yellow">Admin</span> ' : ''}
          ${u.is_verified ? '<span class="badge badge-green">Verified</span>' : '<span class="badge badge-red">Unverified</span>'}
          ${!u.is_active ? ' <span class="badge badge-red">Banned</span>' : ''}
        </td>
        <td class="mono">\u20B9${u.available_balance.toFixed(2)}</td>
        <td>${fmtDate(u.created_at)}</td>
        <td style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="action-btn ${u.is_active?'action-btn-danger':'action-btn-green'}" onclick="toggleUserActive('${u.id}',${u.is_active})">
            ${u.is_active ? 'Ban' : 'Unban'}
          </button>
          <button class="action-btn action-btn-violet" onclick="toggleUserVerified('${u.id}',${u.is_verified})">
            ${u.is_verified ? 'Unverify' : 'Verify'}
          </button>
          <button class="action-btn action-btn-danger" onclick="deleteUser('${u.id}','${u.full_name}')">Delete</button>
        </td>
      </tr>`).join('')}
    </tbody></table>`;
}

function filterUsers() {
  const q = document.getElementById('user-search').value.toLowerCase();
  const plan = document.getElementById('user-plan-filter').value;
  const filtered = _users.filter(u =>
    (!q || u.full_name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)) &&
    (!plan || u.plan === plan)
  );
  renderUsers(filtered);
}

async function toggleUserActive(id, currentActive) {
  try {
    await apiFetch(`/api/admin/users/${id}`, { method:'PATCH', body: JSON.stringify({ is_active: !currentActive }) });
    toast(currentActive ? 'User banned.' : 'User unbanned.');
    await loadUsers();
    await loadSummary();
  } catch(e) { toast(e.message, true); }
}

async function toggleUserVerified(id, currentVerified) {
  try {
    await apiFetch(`/api/admin/users/${id}`, { method:'PATCH', body: JSON.stringify({ is_verified: !currentVerified }) });
    toast(currentVerified ? 'User unverified.' : 'User manually verified.');
    await loadUsers();
  } catch(e) { toast(e.message, true); }
}

async function deleteUser(id, name) {
  if (!confirm(`Permanently delete user "${name}"? This cannot be undone.`)) return;
  try {
    await apiFetch(`/api/admin/users/${id}`, { method:'DELETE' });
    toast('User deleted.');
    await loadUsers();
    await loadSummary();
  } catch(e) { toast(e.message, true); }
}

// ── Links ──────────────────────────────────────────────────────────
async function loadLinks() {
  const wrap = document.getElementById('links-table-wrap');
  try {
    _links = await apiFetch('/api/admin/links');
    renderLinks(_links);
  } catch(e) {
    wrap.innerHTML = `<div class="empty">Failed to load links: ${e.message}</div>`;
  }
}

function renderLinks(list) {
  const wrap = document.getElementById('links-table-wrap');
  if (!list.length) { wrap.innerHTML = '<div class="empty">No affiliate links yet.</div>'; return; }
  wrap.innerHTML = `<table>
    <thead><tr>
      <th>Title</th><th>Slug</th><th>Owner</th><th>Clicks</th><th>Status</th><th>Created</th><th>Actions</th>
    </tr></thead>
    <tbody>
    ${list.map(l => `
      <tr>
        <td>${l.title}</td>
        <td><span class="mono">/r/${l.slug}</span></td>
        <td>${l.owner_name}<br><span class="mono" style="color:var(--muted);font-size:.72rem;">${l.owner_email}</span></td>
        <td class="mono">${l.clicks.toLocaleString()}</td>
        <td><span class="badge ${l.is_active?'badge-green':'badge-red'}">${l.is_active?'Active':'Disabled'}</span></td>
        <td>${fmtDate(l.created_at)}</td>
        <td style="display:flex;gap:6px;">
          <button class="action-btn ${l.is_active?'action-btn-danger':'action-btn-green'}" onclick="toggleLink('${l.id}')">
            ${l.is_active?'Disable':'Enable'}
          </button>
          <button class="action-btn action-btn-danger" onclick="deleteLink('${l.id}')">Delete</button>
        </td>
      </tr>`).join('')}
    </tbody></table>`;
}

function filterLinks() {
  const q = document.getElementById('link-search').value.toLowerCase();
  renderLinks(_links.filter(l =>
    l.title.toLowerCase().includes(q) || l.slug.includes(q) || l.owner_email.toLowerCase().includes(q)
  ));
}

async function toggleLink(id) {
  try {
    await apiFetch(`/api/admin/links/${id}/toggle`, { method:'PATCH' });
    toast('Link status updated.');
    await loadLinks();
  } catch(e) { toast(e.message, true); }
}

async function deleteLink(id) {
  if (!confirm('Delete this affiliate link permanently?')) return;
  try {
    await apiFetch(`/api/admin/links/${id}`, { method:'DELETE' });
    toast('Link deleted.');
    await loadLinks();
    await loadSummary();
  } catch(e) { toast(e.message, true); }
}

// ── Payouts ────────────────────────────────────────────────────────
async function loadPayouts() {
  const wrap = document.getElementById('payouts-table-wrap');
  try {
    _payouts = await apiFetch('/api/admin/payouts');
    renderPayouts(_payouts);
  } catch(e) {
    wrap.innerHTML = `<div class="empty">Failed to load payouts: ${e.message}</div>`;
  }
}

function renderPayouts(list) {
  const wrap = document.getElementById('payouts-table-wrap');
  if (!list.length) { wrap.innerHTML = '<div class="empty">No payout requests yet.</div>'; return; }
  wrap.innerHTML = `<table>
    <thead><tr>
      <th>User</th><th>Amount</th><th>Method</th><th>Details</th><th>Status</th><th>Date</th><th>Actions</th>
    </tr></thead>
    <tbody>
    ${list.map(p => `
      <tr>
        <td>${p.user_name}<br><span class="mono" style="color:var(--muted);font-size:.72rem;">${p.user_email}</span></td>
        <td class="mono" style="font-weight:700;">\u20B9${p.amount.toFixed(2)}</td>
        <td>${p.method.toUpperCase()}</td>
        <td class="mono" style="font-size:.78rem;">${p.details}</td>
        <td>
          <span class="badge ${p.status==='Paid'?'badge-green':p.status==='Processing'?'badge-blue':'badge-yellow'}">
            ${p.status}
          </span>
        </td>
        <td>${fmtDate(p.created_at)}</td>
        <td style="display:flex;gap:6px;flex-wrap:wrap;">
          ${p.status!=='Processing' ? `<button class="action-btn action-btn-violet" onclick="updatePayout('${p.id}','Processing')">Processing</button>` : ''}
          ${p.status!=='Paid' ? `<button class="action-btn action-btn-green" onclick="updatePayout('${p.id}','Paid')">Mark Paid</button>` : ''}
        </td>
      </tr>`).join('')}
    </tbody></table>`;
}

function filterPayouts() {
  const s = document.getElementById('payout-status-filter').value;
  renderPayouts(s ? _payouts.filter(p => p.status === s) : _payouts);
}

async function updatePayout(id, status) {
  try {
    await apiFetch(`/api/admin/payouts/${id}`, { method:'PATCH', body: JSON.stringify({ status }) });
    toast(`Payout marked as ${status}.`);
    await loadPayouts();
    await loadSummary();
  } catch(e) { toast(e.message, true); }
}

// ── Messages ───────────────────────────────────────────────────────
async function loadMessages() {
  const wrap = document.getElementById('messages-table-wrap');
  try {
    _messages = await apiFetch('/api/admin/messages');
    if (!_messages.length) { wrap.innerHTML = '<div class="empty">No contact messages yet.</div>'; return; }
    wrap.innerHTML = `<table>
      <thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Date</th><th>Actions</th></tr></thead>
      <tbody>
      ${_messages.map(m => `
        <tr>
          <td style="font-weight:${m.is_read?'400':'600'}">${m.name}</td>
          <td class="mono">${m.email}</td>
          <td>${m.subject}</td>
          <td style="max-width:260px;white-space:normal;font-size:.82rem;">${m.message.substring(0,100)}${m.message.length>100?'…':''}</td>
          <td>${fmtDate(m.created_at)}</td>
          <td style="display:flex;gap:6px;">
            ${!m.is_read ? `<button class="action-btn action-btn-green" onclick="markMsgRead('${m.id}')">Mark Read</button>` : '<span class="badge badge-gray">Read</span>'}
            <button class="action-btn action-btn-danger" onclick="deleteMsg('${m.id}')">Delete</button>
          </td>
        </tr>`).join('')}
      </tbody></table>`;
  } catch(e) {
    wrap.innerHTML = `<div class="empty">Failed to load messages: ${e.message}</div>`;
  }
}

async function markMsgRead(id) {
  try {
    await apiFetch(`/api/admin/messages/${id}/read`, { method:'PATCH' });
    toast('Marked as read.');
    await loadMessages();
    await loadSummary();
  } catch(e) { toast(e.message, true); }
}

async function deleteMsg(id) {
  if (!confirm('Delete this message?')) return;
  try {
    await apiFetch(`/api/admin/messages/${id}`, { method:'DELETE' });
    toast('Message deleted.');
    await loadMessages();
    await loadSummary();
  } catch(e) { toast(e.message, true); }
}

// ── Notifications ──────────────────────────────────────────────────
async function loadNotifications() {
  const wrap = document.getElementById('notifications-table-wrap');
  try {
    const notifs = await apiFetch('/api/admin/notifications');
    if (!notifs.length) { wrap.innerHTML = '<div class="empty">No notifications sent yet.</div>'; return; }
    wrap.innerHTML = `<table>
      <thead><tr><th>Title</th><th>Body</th><th>Type</th><th>Target</th><th>Sent</th></tr></thead>
      <tbody>
      ${notifs.map(n => `
        <tr>
          <td style="font-weight:600;">${n.title}</td>
          <td style="font-size:.85rem;">${n.body.substring(0,80)}${n.body.length>80?'…':''}</td>
          <td><span class="badge ${n.type==='success'?'badge-green':n.type==='warning'?'badge-yellow':n.type==='payment'?'badge-blue':'badge-gray'}">${n.type}</span></td>
          <td class="mono" style="font-size:.78rem;">${n.user_id ? n.user_id.substring(0,8)+'…' : 'Broadcast'}</td>
          <td>${fmtDate(n.created_at)}</td>
        </tr>`).join('')}
      </tbody></table>`;
  } catch(e) {
    wrap.innerHTML = `<div class="empty">Failed to load notifications: ${e.message}</div>`;
  }
}

function openNotifModal() { document.getElementById('notif-modal').classList.add('open'); }
function closeNotifModal() { document.getElementById('notif-modal').classList.remove('open'); }

async function sendNotification() {
  const title = document.getElementById('notif-title').value.trim();
  const body  = document.getElementById('notif-body').value.trim();
  const type  = document.getElementById('notif-type').value;
  const user_id = document.getElementById('notif-target').value || null;
  if (!title || !body) { toast('Title and message are required.', true); return; }
  try {
    await apiFetch('/api/admin/notifications', {
      method: 'POST',
      body: JSON.stringify({ title, body, type, user_id })
    });
    toast('Notification sent!');
    closeNotifModal();
    document.getElementById('notif-title').value = '';
    document.getElementById('notif-body').value = '';
  } catch(e) { toast(e.message, true); }
}

// ── Theme ──────────────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('affinova_admin_theme', isDark ? 'light' : 'dark');
}

// ── Boot ───────────────────────────────────────────────────────────
(function boot() {
  // Restore theme
  const t = localStorage.getItem('affinova_admin_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);

  // If already logged in
  if (TOKEN) {
    fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${TOKEN}` } })
      .then(r => r.json())
      .then(user => {
        if (user.is_admin) {
          document.getElementById('login-overlay').style.display = 'none';
          document.getElementById('topbar-initials').textContent = user.full_name.charAt(0).toUpperCase();
          initAdminPanel();
        } else {
          localStorage.removeItem('affinova_admin_token');
          TOKEN = '';
        }
      })
      .catch(() => { localStorage.removeItem('affinova_admin_token'); TOKEN = ''; });
  }

  // Enter key on login
  document.getElementById('admin-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') adminLogin();
  });
})();
</script>
</body>
</html>
